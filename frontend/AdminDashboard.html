<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | EDU Work</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#FAFAFA;color:#333;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:#fff;border-bottom:1px solid #E8E8E8;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:#111;}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-user{font-size:14px;color:#666;}
.logout-btn{padding:8px 16px;background:#fff;border:1px solid #E8E8E8;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;color:#666;}
.logout-btn:hover{border-color:#6C47FF;color:#6C47FF;}
.layout{display:flex;margin-top:64px;min-height:calc(100vh - 64px);}
.sidebar{width:220px;background:#fff;border-right:1px solid #E8E8E8;padding:24px 0;position:fixed;top:64px;bottom:0;overflow-y:auto;}
.sidebar-item{display:block;padding:12px 24px;color:#666;text-decoration:none;font-size:14px;font-weight:500;transition:all 0.2s;border-left:3px solid transparent;cursor:pointer;}
.sidebar-item:hover,.sidebar-item.active{background:#F5F3FF;color:#6C47FF;border-left-color:#6C47FF;}
.main{margin-left:220px;padding:36px;flex:1;}
.page{display:none;}
.page.active{display:block;}
h2{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:#111;margin-bottom:6px;}
.page-sub{color:#888;font-size:14px;margin-bottom:28px;}

/* Stats */
.stats-section{margin-bottom:36px;}
.stats-group-label{font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#aaa;margin-bottom:12px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-box{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:22px 20px;}
.stat-box .num{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#6C47FF;line-height:1;}
.stat-box .lbl{font-size:12px;color:#888;margin-top:6px;font-weight:500;}
.stat-box.green .num{color:#16A34A;}
.stat-box.amber .num{color:#D97706;}
.stat-box.red .num{color:#DC2626;}
.stat-box.blue .num{color:#2563EB;}

/* Users table */
.table-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.table-toolbar input{padding:9px 14px;border:1px solid #E8E8E8;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:14px;width:240px;}
.table-toolbar input:focus{outline:none;border-color:#6C47FF;}
.table-toolbar select{padding:9px 13px;border:1px solid #E8E8E8;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:14px;}
.table-toolbar select:focus{outline:none;border-color:#6C47FF;}
.users-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #E8E8E8;}
.users-table th{background:#F9FAFB;padding:12px 16px;text-align:left;font-size:12px;color:#888;font-weight:600;border-bottom:1px solid #E8E8E8;text-transform:uppercase;letter-spacing:0.05em;}
.users-table td{padding:14px 16px;font-size:14px;border-bottom:1px solid #F5F5F5;vertical-align:middle;}
.users-table tr:last-child td{border-bottom:none;}
.users-table tr:hover td{background:#FAFAFA;}
.role-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.role-student{background:#EDE9FF;color:#6C47FF;}
.role-company{background:#DBEAFE;color:#1D4ED8;}
.role-admin{background:#FEF3C7;color:#92400E;}
.status-pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.pill-active{background:#F0FFF4;color:#166534;}
.pill-inactive{background:#FFF1F2;color:#9F1239;}
.action-btn{padding:6px 12px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity 0.2s;}
.btn-deactivate{background:#FFF1F2;color:#9F1239;}
.btn-deactivate:hover{opacity:0.8;}
.btn-activate{background:#F0FFF4;color:#166534;}
.btn-activate:hover{opacity:0.8;}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* Pagination */
.pagination{display:flex;align-items:center;gap:8px;margin-top:20px;justify-content:flex-end;}
.page-btn{padding:7px 13px;border:1px solid #E8E8E8;border-radius:6px;background:#fff;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;}
.page-btn:hover{border-color:#6C47FF;color:#6C47FF;}
.page-btn.active{background:#6C47FF;color:#fff;border-color:#6C47FF;}
.page-btn:disabled{opacity:0.4;cursor:not-allowed;}

.loading{text-align:center;padding:48px;color:#888;}
.success-banner{background:#F0FFF4;border:1px solid #68D391;color:#276749;padding:12px 16px;border-radius:6px;margin-bottom:20px;display:none;font-size:14px;}
.empty{text-align:center;padding:48px;color:#888;}
</style>
</head>
<body>
<nav>
  <div class="logo">EDU Work <span style="font-size:11px;background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:8px;vertical-align:middle;">Admin</span></div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <a class="sidebar-item active" onclick="showPage('overview',this)" href="#">Overview</a>
    <a class="sidebar-item" onclick="showPage('users',this)" href="#">Manage Users</a>
  </aside>

  <main class="main">
    <div id="success-banner" class="success-banner"></div>

    <!-- OVERVIEW -->
    <div class="page active" id="page-overview">
      <h2>System Overview</h2>
      <p class="page-sub">Live stats across the entire EDU-Work platform.</p>
      <div id="stats-container"><div class="loading">Loading stats...</div></div>
    </div>

    <!-- USERS -->
    <div class="page" id="page-users">
      <h2>Manage Users</h2>
      <p class="page-sub">View, filter, and manage all registered users.</p>
      <div class="table-toolbar">
        <input type="text" id="search-input" placeholder="Search by name or email..." oninput="filterUsers()">
        <select id="role-filter" onchange="filterUsers()">
          <option value="">All Roles</option>
          <option value="student">Students</option>
          <option value="company">Companies</option>
          <option value="admin">Admins</option>
        </select>
      </div>
      <div id="users-container"><div class="loading">Loading users...</div></div>
      <div id="pagination" class="pagination"></div>
    </div>
  </main>
</div>

<script src="api.js"></script>
<script>
  const user = requireAuth(['admin']);
  if (user) document.getElementById('nav-user').textContent = user.firstName + ' ' + user.lastName;

  let allUsers = [];

  function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');
    if (name === 'overview') loadStats();
    if (name === 'users') loadUsers();
  }

  function showBanner(msg) {
    const b = document.getElementById('success-banner');
    b.textContent = msg; b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 4000);
  }

  // ── Stats ──────────────────────────────────────────────────────────────────
  async function loadStats() {
    document.getElementById('stats-container').innerHTML = '<div class="loading">Loading stats...</div>';
    try {
      const data = await admin.getDashboard();
      const u = data.users || {};
      const j = data.jobs || {};
      const a = data.applications || {};

      document.getElementById('stats-container').innerHTML = `
        <div class="stats-section">
          <p class="stats-group-label">Users</p>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="num">${u.totalUsers ?? '—'}</div>
              <div class="lbl">Total Users</div>
            </div>
            <div class="stat-box blue">
              <div class="num">${u.totalStudents ?? '—'}</div>
              <div class="lbl">Students</div>
            </div>
            <div class="stat-box">
              <div class="num">${u.totalCompanies ?? '—'}</div>
              <div class="lbl">Companies</div>
            </div>
          </div>
        </div>
        <div class="stats-section">
          <p class="stats-group-label">Jobs</p>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="num">${j.totalJobs ?? '—'}</div>
              <div class="lbl">Total Jobs</div>
            </div>
            <div class="stat-box green">
              <div class="num">${j.openJobs ?? '—'}</div>
              <div class="lbl">Open Jobs</div>
            </div>
          </div>
        </div>
        <div class="stats-section">
          <p class="stats-group-label">Applications</p>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="num">${a.totalApplications ?? '—'}</div>
              <div class="lbl">Total Applications</div>
            </div>
            <div class="stat-box amber">
              <div class="num">${a.pendingApplications ?? '—'}</div>
              <div class="lbl">Pending</div>
            </div>
            <div class="stat-box green">
              <div class="num">${a.acceptedApplications ?? '—'}</div>
              <div class="lbl">Accepted</div>
            </div>
            <div class="stat-box red">
              <div class="num">${a.rejectedApplications ?? '—'}</div>
              <div class="lbl">Rejected</div>
            </div>
          </div>
        </div>
      `;
    } catch(e) {
      document.getElementById('stats-container').innerHTML = `<p style="color:#e53e3e;padding:20px;">${e.message}</p>`;
    }
  }

  // ── Users ──────────────────────────────────────────────────────────────────
  async function loadUsers() {
    document.getElementById('users-container').innerHTML = '<div class="loading">Loading users...</div>';
    try {
      const data = await admin.getUsers();
      allUsers = data.users || [];
      filterUsers();
    } catch(e) {
      document.getElementById('users-container').innerHTML = `<p style="color:#e53e3e;padding:20px;">${e.message}</p>`;
    }
  }

  function filterUsers() {
    const search = document.getElementById('search-input').value.toLowerCase();
    const role = document.getElementById('role-filter').value;
    const filtered = allUsers.filter(u => {
      const matchesRole = !role || u.role === role;
      const matchesSearch = !search ||
        (u.firstName + ' ' + u.lastName).toLowerCase().includes(search) ||
        u.email.toLowerCase().includes(search);
      return matchesRole && matchesSearch;
    });
    renderUsers(filtered);
  }

  function renderUsers(list) {
    const el = document.getElementById('users-container');
    if (!list.length) {
      el.innerHTML = '<div class="empty">No users found.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    el.innerHTML = `
      <table class="users-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(u => `
            <tr id="row-${u._id}">
              <td style="font-weight:500;color:#111;">${u.firstName} ${u.lastName}</td>
              <td style="color:#666;">${u.email}</td>
              <td><span class="role-badge role-${u.role}">${u.role}</span></td>
              <td style="color:#888;font-size:13px;">${new Date(u.createdAt).toLocaleDateString()}</td>
              <td><span class="status-pill ${u.isActive ? 'pill-active' : 'pill-inactive'}">${u.isActive ? 'Active' : 'Inactive'}</span></td>
              <td>
                ${u.isActive
                  ? `<button class="action-btn btn-deactivate" onclick="toggleUser('${u._id}','deactivate',this)">Deactivate</button>`
                  : `<button class="action-btn btn-activate" onclick="toggleUser('${u._id}','activate',this)">Activate</button>`
                }
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
    document.getElementById('pagination').innerHTML = `<span style="font-size:13px;color:#888;">${list.length} user${list.length !== 1 ? 's' : ''} shown</span>`;
  }

  async function toggleUser(userId, action, btn) {
    btn.disabled = true;
    try {
      if (action === 'deactivate') await admin.deactivate(userId);
      else await admin.activate(userId);
      // Update in allUsers array and re-render
      const u = allUsers.find(u => u._id === userId);
      if (u) u.isActive = action === 'activate';
      filterUsers();
      showBanner(`User ${action}d successfully.`);
    } catch(e) {
      alert(e.message);
      btn.disabled = false;
    }
  }

  // Load overview on start
  loadStats();
</script>
</body>
</html>
