<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | EDU Work</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#FAFAFA;color:#333;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:#fff;border-bottom:1px solid #E8E8E8;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:#111;}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-user{font-size:14px;color:#666;}
.logout-btn{padding:8px 16px;background:#fff;border:1px solid #E8E8E8;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;color:#666;}
.logout-btn:hover{border-color:#6C47FF;color:#6C47FF;}
.layout{display:flex;margin-top:64px;min-height:calc(100vh - 64px);}
.sidebar{width:220px;background:#fff;border-right:1px solid #E8E8E8;padding:24px 0;position:fixed;top:64px;bottom:0;}
.sidebar-item{display:block;padding:12px 24px;color:#666;text-decoration:none;font-size:14px;font-weight:500;transition:all 0.2s;border-left:3px solid transparent;}
.sidebar-item:hover,.sidebar-item.active{background:#F5F3FF;color:#6C47FF;border-left-color:#6C47FF;}
.main{margin-left:220px;padding:36px;flex:1;}
.page{display:none;}
.page.active{display:block;}
h2{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:#111;margin-bottom:24px;}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:36px;}
.stat-box{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:24px;}
.stat-box .num{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:#6C47FF;}
.stat-box .lbl{font-size:13px;color:#888;margin-top:4px;}
.jobs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.card{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:24px;}
.card h3{font-size:16px;font-weight:600;color:#111;margin-bottom:6px;}
.card .meta{font-size:13px;color:#888;margin-bottom:12px;}
.card .desc{font-size:13px;color:#666;margin-bottom:12px;line-height:1.6;}
.tag{background:#EDE9FF;color:#6C47FF;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.salary{font-weight:600;color:#6C47FF;font-size:14px;margin:8px 0;}
.apply-btn{width:100%;padding:10px;background:#6C47FF;color:#fff;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;margin-top:12px;}
.apply-btn:hover{background:#4F2FD4;}
.filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.filters select,.filters input{padding:9px 13px;border-radius:6px;border:1px solid #E8E8E8;font-family:'DM Sans',sans-serif;font-size:14px;}
.filters select:focus,.filters input:focus{outline:none;border-color:#6C47FF;}
.filter-btn{padding:9px 18px;background:#6C47FF;color:#fff;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;}
/* Applications table */
.app-card{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.app-info h4{font-size:15px;font-weight:600;color:#111;}
.app-info p{font-size:13px;color:#888;margin-top:3px;}
.status-badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.status-pending{background:#FEFCE8;color:#854D0E;}
.status-accepted{background:#F0FFF4;color:#166534;}
.status-rejected{background:#FFF1F2;color:#9F1239;}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:12px;padding:36px;width:90%;max-width:480px;}
.modal h2{font-family:'Syne',sans-serif;font-size:22px;margin-bottom:6px;}
.modal-meta{color:#888;font-size:13px;margin-bottom:20px;}
textarea{width:100%;padding:12px;border-radius:6px;border:1px solid #E8E8E8;font-family:'DM Sans',sans-serif;font-size:14px;resize:vertical;min-height:120px;box-sizing:border-box;}
textarea:focus{outline:none;border-color:#6C47FF;}
.modal-btns{display:flex;gap:12px;margin-top:16px;}
.modal-btns button{flex:1;padding:11px;border-radius:6px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;}
.btn-cancel{background:#fff;border:1px solid #E8E8E8;color:#666;}
.btn-submit{background:#6C47FF;color:#fff;border:none;}
.btn-submit:hover{background:#4F2FD4;}
.err{color:#e53e3e;font-size:13px;margin-top:8px;display:none;}
.success-banner{background:#F0FFF4;border:1px solid #68D391;color:#276749;padding:12px 16px;border-radius:6px;margin-bottom:20px;display:none;font-size:14px;}
.loading{text-align:center;padding:40px;color:#888;}
</style>
</head>
<body>
<nav>
  <div class="logo">EDU Work</div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="layout">
  <aside class="sidebar">
    <a class="sidebar-item active" onclick="showPage('jobs')" href="#">Browse Jobs</a>
    <a class="sidebar-item" onclick="showPage('applications')" href="#">My Applications</a>
  </aside>
  <main class="main">
    <div id="success-banner" class="success-banner"></div>

    <!-- BROWSE JOBS -->
    <div class="page active" id="page-jobs">
      <h2>Browse Jobs</h2>
      <div class="filters">
        <select id="filter-type"><option value="">All Types</option><option value="internship">Internship</option><option value="entry-level">Entry Level</option><option value="part-time">Part Time</option></select>
        <input type="text" id="filter-location" placeholder="Location...">
        <button class="filter-btn" onclick="loadJobs()">Search</button>
        <button class="filter-btn" style="background:#fff;color:#6C47FF;border:1px solid #6C47FF;" onclick="clearFilters()">Clear</button>
      </div>
      <div id="jobs-grid" class="jobs-grid"><div class="loading">Loading...</div></div>
    </div>

    <!-- MY APPLICATIONS -->
    <div class="page" id="page-applications">
      <h2>My Applications</h2>
      <div id="apps-list"><div class="loading">Loading...</div></div>
    </div>
  </main>
</div>

<!-- Apply Modal -->
<div class="modal-overlay" id="apply-modal">
  <div class="modal">
    <h2 id="modal-title">Apply</h2>
    <p class="modal-meta" id="modal-meta"></p>
    <label style="font-weight:500;font-size:14px;display:block;margin-bottom:6px;">Cover Letter</label>
    <textarea id="cover-letter" placeholder="Tell the company why you're a great fit..."></textarea>
    <div id="apply-err" class="err"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" id="submit-btn" onclick="submitApplication()">Submit</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  const user = requireAuth(['student']);
  if (user) document.getElementById('nav-user').textContent = user.firstName + ' ' + user.lastName;

  let currentJobId = null;

  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    event.target.classList.add('active');
    if (name === 'applications') loadMyApplications();
  }

  async function loadJobs() {
    const type = document.getElementById('filter-type').value;
    const loc = document.getElementById('filter-location').value.trim();
    const params = {};
    if (type) params.jobType = type;
    if (loc) params.location = loc;
    document.getElementById('jobs-grid').innerHTML = '<div class="loading">Loading...</div>';
    try {
      const data = await jobs.getAll(params);
      renderJobs(data.jobs || []);
    } catch(e) { document.getElementById('jobs-grid').innerHTML = `<p style="color:#e53e3e;padding:20px;">${e.message}</p>`; }
  }

  function clearFilters() { document.getElementById('filter-type').value=''; document.getElementById('filter-location').value=''; loadJobs(); }

  function renderJobs(list) {
    const g = document.getElementById('jobs-grid');
    if (!list.length) { g.innerHTML='<p style="color:#888;padding:20px;">No jobs found.</p>'; return; }
    g.innerHTML = list.map(j => `
      <div class="card">
        <h3>${j.title}</h3>
        <p class="meta">${j.companyId?.firstName ? j.companyId.firstName+' '+j.companyId.lastName : 'Company'} &middot; ${j.location}</p>
        <p class="desc">${j.description}</p>
        ${j.requirements?.length ? `<p style="font-size:12px;color:#aaa;margin-bottom:8px;">${j.requirements.join(' · ')}</p>` : ''}
        <p class="salary">${j.salary||''}</p>
        <span class="tag">${j.jobType}</span>
        <button class="apply-btn" onclick="openApply('${j._id}','${escAttr(j.title)}','${j.companyId?.firstName||''}')">Apply Now</button>
      </div>`).join('');
  }

  function escAttr(s) { return s.replace(/'/g,"&#39;"); }

  async function loadMyApplications() {
    document.getElementById('apps-list').innerHTML = '<div class="loading">Loading...</div>';
    try {
      const data = await applications.getMyApplications();
      renderApplications(data.applications || []);
    } catch(e) { document.getElementById('apps-list').innerHTML = `<p style="color:#e53e3e;padding:20px;">${e.message}</p>`; }
  }

  function renderApplications(list) {
    const el = document.getElementById('apps-list');
    if (!list.length) { el.innerHTML='<p style="color:#888;padding:20px;">No applications yet. Browse jobs and apply!</p>'; return; }
    el.innerHTML = list.map(a => `
      <div class="app-card">
        <div class="app-info">
          <h4>${a.jobId?.title || 'Job'}</h4>
          <p>${a.jobId?.location || ''} &middot; ${a.jobId?.jobType || ''} &middot; Applied ${new Date(a.appliedAt).toLocaleDateString()}</p>
        </div>
        <span class="status-badge status-${a.status}">${a.status.charAt(0).toUpperCase()+a.status.slice(1)}</span>
      </div>`).join('');
  }

  function openApply(jobId, title, company) {
    currentJobId = jobId;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-meta').textContent = company;
    document.getElementById('cover-letter').value = '';
    document.getElementById('apply-err').style.display = 'none';
    document.getElementById('apply-modal').classList.add('open');
  }

  function closeModal() { document.getElementById('apply-modal').classList.remove('open'); currentJobId = null; }

  async function submitApplication() {
    const cl = document.getElementById('cover-letter').value.trim();
    const errEl = document.getElementById('apply-err');
    errEl.style.display = 'none';
    if (!cl) { errEl.textContent='Please write a cover letter.'; errEl.style.display='block'; return; }
    const btn = document.getElementById('submit-btn');
    btn.disabled=true; btn.textContent='Submitting...';
    try {
      await applications.apply(currentJobId, cl);
      closeModal();
      const b = document.getElementById('success-banner');
      b.textContent = 'Application submitted!'; b.style.display='block';
      setTimeout(()=>b.style.display='none', 4000);
    } catch(e) { errEl.textContent=e.message; errEl.style.display='block'; }
    finally { btn.disabled=false; btn.textContent='Submit'; }
  }

  document.getElementById('apply-modal').addEventListener('click', e => { if(e.target===document.getElementById('apply-modal')) closeModal(); });

  loadJobs();
</script>
</body>
</html>
