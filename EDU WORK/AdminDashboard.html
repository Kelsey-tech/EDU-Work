<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | EDU Work</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#FAFAFA;color:#333;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:#fff;border-bottom:1px solid #E8E8E8;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:#111;}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-user{font-size:14px;color:#666;}
.logout-btn{padding:8px 16px;background:#fff;border:1px solid #E8E8E8;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;color:#666;}
.logout-btn:hover{border-color:#6C47FF;color:#6C47FF;}
.layout{display:flex;margin-top:64px;min-height:calc(100vh - 64px);}
.sidebar{width:220px;background:#fff;border-right:1px solid #E8E8E8;padding:24px 0;position:fixed;top:64px;bottom:0;}
.sidebar-item{display:block;padding:12px 24px;color:#666;text-decoration:none;font-size:14px;font-weight:500;transition:all 0.2s;border-left:3px solid transparent;cursor:pointer;}
.sidebar-item:hover,.sidebar-item.active{background:#F5F3FF;color:#6C47FF;border-left-color:#6C47FF;}
.main{margin-left:220px;padding:36px;flex:1;}
.page{display:none;}
.page.active{display:block;}
h2{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:#111;margin-bottom:24px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:36px;}
.stat-box{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:24px;}
.stat-box .num{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:#6C47FF;}
.stat-box .lbl{font-size:13px;color:#888;margin-top:4px;}
/* Users table */
.users-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #E8E8E8;}
.users-table th{background:#F9FAFB;padding:12px 16px;text-align:left;font-size:13px;color:#888;font-weight:500;border-bottom:1px solid #E8E8E8;}
.users-table td{padding:14px 16px;font-size:14px;border-bottom:1px solid #F0F0F0;}
.users-table tr:last-child td{border-bottom:none;}
.role-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.role-student{background:#EDE9FF;color:#6C47FF;}
.role-company{background:#DBEAFE;color:#1D4ED8;}
.role-admin{background:#FEF3C7;color:#92400E;}
.active-badge{background:#F0FFF4;color:#166534;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.inactive-badge{background:#FFF1F2;color:#9F1239;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.action-btn{padding:6px 12px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;}
.btn-deactivate{background:#FFF1F2;color:#9F1239;}
.btn-activate{background:#F0FFF4;color:#166534;}
.action-btn:disabled{opacity:0.5;cursor:not-allowed;}
.loading{text-align:center;padding:40px;color:#888;}
.success-banner{background:#F0FFF4;border:1px solid #68D391;color:#276749;padding:12px 16px;border-radius:6px;margin-bottom:20px;display:none;font-size:14px;}
</style>
</head>
<body>
<nav>
  <div class="logo">EDU Work</div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="layout">
  <aside class="sidebar">
    <a class="sidebar-item active" onclick="showPage('overview',this)" href="#">Overview</a>
    <a class="sidebar-item" onclick="showPage('users',this)" href="#">Manage Users</a>
  </aside>
  <main class="main">
    <div id="success-banner" class="success-banner"></div>

    <!-- OVERVIEW -->
    <div class="page active" id="page-overview">
      <h2>System Overview</h2>
      <div id="stats-grid" class="stats-grid"><div class="loading" style="grid-column:1/-1;">Loading stats...</div></div>
    </div>

    <!-- USERS -->
    <div class="page" id="page-users">
      <h2>All Users</h2>
      <div id="users-container"><div class="loading">Loading...</div></div>
    </div>
  </main>
</div>

<script src="api.js"></script>
<script>
  const user = requireAuth(['admin']);
  if (user) document.getElementById('nav-user').textContent = user.firstName + ' ' + user.lastName;

  function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');
    if (name === 'overview') loadStats();
    if (name === 'users') loadUsers();
  }

  function showBanner(msg) {
    const b = document.getElementById('success-banner');
    b.textContent = msg; b.style.display='block';
    setTimeout(()=>b.style.display='none',4000);
  }

  async function loadStats() {
    try {
      const data = await admin.getDashboard();
      const s = data.stats || data;
      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-box"><div class="num">${s.totalUsers??'—'}</div><div class="lbl">Total Users</div></div>
        <div class="stat-box"><div class="num">${s.totalStudents??'—'}</div><div class="lbl">Students</div></div>
        <div class="stat-box"><div class="num">${s.totalCompanies??s.totalEmployers??'—'}</div><div class="lbl">Companies</div></div>
        <div class="stat-box"><div class="num">${s.totalJobs??'—'}</div><div class="lbl">Jobs Posted</div></div>
        <div class="stat-box"><div class="num">${s.totalApplications??'—'}</div><div class="lbl">Applications</div></div>
        <div class="stat-box"><div class="num">${s.activeUsers??s.activeAccounts??'—'}</div><div class="lbl">Active Users</div></div>
        <div class="stat-box"><div class="num">${s.openJobs??'—'}</div><div class="lbl">Open Jobs</div></div>
        <div class="stat-box"><div class="num">${s.pendingApplications??'—'}</div><div class="lbl">Pending Apps</div></div>
      `;
    } catch(e) {
      document.getElementById('stats-grid').innerHTML = `<p style="color:#e53e3e;grid-column:1/-1;padding:20px;">${e.message}</p>`;
    }
  }

  async function loadUsers() {
    document.getElementById('users-container').innerHTML = '<div class="loading">Loading...</div>';
    try {
      const data = await admin.getUsers();
      renderUsers(data.users || []);
    } catch(e) { document.getElementById('users-container').innerHTML = `<p style="color:#e53e3e;padding:20px;">${e.message}</p>`; }
  }

  function renderUsers(list) {
    if (!list.length) { document.getElementById('users-container').innerHTML='<p style="color:#888;padding:20px;">No users found.</p>'; return; }
    document.getElementById('users-container').innerHTML = `
      <table class="users-table">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${list.map(u => `
          <tr id="user-row-${u._id}">
            <td>${u.firstName} ${u.lastName}</td>
            <td>${u.email}</td>
            <td><span class="role-badge role-${u.role}">${u.role}</span></td>
            <td><span class="${u.isActive?'active-badge':'inactive-badge'}">${u.isActive?'Active':'Inactive'}</span></td>
            <td>
              ${u.isActive
                ? `<button class="action-btn btn-deactivate" onclick="toggleUser('${u._id}','deactivate',this)">Deactivate</button>`
                : `<button class="action-btn btn-activate" onclick="toggleUser('${u._id}','activate',this)">Activate</button>`
              }
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  }

  async function toggleUser(userId, action, btn) {
    btn.disabled = true;
    try {
      if (action === 'deactivate') await admin.deactivate(userId);
      else await admin.activate(userId);
      showBanner(`User ${action}d successfully.`);
      loadUsers();
    } catch(e) { alert(e.message); btn.disabled=false; }
  }

  loadStats();
</script>
</body>
</html>
